<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeamPick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #14202b; --muted: #5a6876; --line: #d9e0e7;
  --orange: #f2670f; --orange-ink: #b0440a; --on-orange: #14202b;
  --jere: #1d63d8; --jere-bg: #e5eefd; --jesica: #7c3aed; --jesica-bg: #efe8fe;
  --ok: #17804a; --ok-bg: #e2f4ea; --warn: #855600; --warn-bg: #fff0c7; --bad: #c22d22; --bad-bg: #fde7e5;
  --qty-bg: #14202b; --qty-ink: #ffffff; --on-runner: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #19222c; --ink: #edf1f5; --muted: #9ba8b5; --line: #2b3744;
    --orange: #ff7d1f; --orange-ink: #ff9d57; --on-orange: #14202b;
    --jere: #74acff; --jere-bg: #172a4b; --jesica: #b999ff; --jesica-bg: #2a204e;
    --ok: #4dc48b; --ok-bg: #12301f; --warn: #f1c453; --warn-bg: #3a2e0d; --bad: #ff8076; --bad-bg: #421b18;
    --qty-bg: #edf1f5; --qty-ink: #0f151b; --on-runner: #0f151b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #19222c; --ink: #edf1f5; --muted: #9ba8b5; --line: #2b3744;
  --orange: #ff7d1f; --orange-ink: #ff9d57; --on-orange: #14202b;
  --jere: #74acff; --jere-bg: #172a4b; --jesica: #b999ff; --jesica-bg: #2a204e;
  --ok: #4dc48b; --ok-bg: #12301f; --warn: #f1c453; --warn-bg: #3a2e0d; --bad: #ff8076; --bad-bg: #421b18;
  --qty-bg: #edf1f5; --qty-ink: #0f151b; --on-runner: #0f151b;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 60px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--body); padding-bottom: 84px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: 0.005em; line-height: 1.05; }
h1 { font-size: 34px; } h2 { font-size: 25px; } h3 { font-size: 20px; }
p { margin: 0; max-width: 62ch; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 620px; margin: 0 auto; padding: 8px 14px; display: flex; align-items: center; gap: 10px; min-height: 54px; }
.mark { font: 700 26px/1 var(--display); background: none; border: 0; padding: 4px 0; display: flex; align-items: baseline; }
.mark i { font-style: normal; color: var(--orange-ink); }
.top-trip { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.25; }
.top-trip b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.me { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 600; min-height: 40px; white-space: nowrap; }
.me.jere { border-color: var(--jere); color: var(--jere); background: var(--jere-bg); }
.me.jesica { border-color: var(--jesica); color: var(--jesica); background: var(--jesica-bg); }

main { max-width: 620px; margin: 0 auto; padding: 16px 14px 24px; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card.jere { border-top: 4px solid var(--jere); } .card.jesica { border-top: 4px solid var(--jesica); }
.who-jere { color: var(--jere); } .who-jesica { color: var(--jesica); }

.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; min-height: 46px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.btn.wide { width: 100%; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); min-height: 40px; padding: 6px 8px; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 15px; }

.field { display: block; } .field > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.in { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 46px; }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; min-height: 42px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button.jere[aria-pressed="true"] { background: var(--jere); color: var(--on-runner); }
.seg button.jesica[aria-pressed="true"] { background: var(--jesica); color: var(--on-runner); }

.banner { border-radius: 8px; padding: 10px 12px; font-size: 15px; background: var(--warn-bg); color: var(--warn); border: 1px solid currentColor; }
.banner.bad { background: var(--bad-bg); color: var(--bad); } .banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.plain { background: var(--surface); color: var(--muted); border-color: var(--line); }
.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 600; background: var(--line); color: var(--ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.flagtxt { color: var(--warn); font-size: 14px; font-weight: 500; }

/* progress */
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
.bar.jere > i { background: var(--jere); } .bar.jesica > i { background: var(--jesica); }

/* customer bag tags */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; max-width: 100%; }
.tag b { flex: none; width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; color: #fff; font: 700 15px/1 var(--display); }
.tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t0 b { background: #0e7c86; } .t1 b { background: #b0307a; } .t2 b { background: #647214; } .t3 b { background: #8a5a2b; }
.t4 b { background: #4a5a6a; } .t5 b { background: #0b6fa4; } .t6 b { background: #c2415b; } .t7 b { background: #2f7d4f; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }

/* department section */
.dept { margin-top: 18px; }
.dept-h { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 6px 0; text-align: left; border-bottom: 2px solid var(--ink); }
.dept-h h2 { flex: 1; } .dept-h .count { font: 600 18px/1 var(--display); color: var(--muted); }
.dept-h .ico { font-size: 20px; }

/* the pick row: quantity block reads like a shelf tag */
.pick { display: grid; grid-template-columns: 58px 1fr 56px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; overflow: hidden; }
.pick .qty { background: var(--qty-bg); color: var(--qty-ink); display: grid; place-items: center; font: 700 34px/1 var(--display); padding: 6px 2px; }
.pick .qty small { display: block; font: 600 12px/1 var(--body); opacity: 0.75; margin-top: 2px; text-align: center; }
.pick .body { padding: 9px 10px; min-width: 0; background: none; border: 0; text-align: left; }
.pick .name { font-size: 18px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.pick .meta { font-size: 14px; color: var(--muted); margin-top: 1px; }
.pick .note { font-size: 14px; color: var(--warn); margin-top: 3px; }
.pick .check { border: 0; border-left: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.pick .check span { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--muted); display: grid; place-items: center; font-size: 20px; font-weight: 700; color: transparent; }
.pick.done { opacity: 0.62; } .pick.done .qty { background: var(--ok); color: #fff; }
.pick.done .check span { background: var(--ok); border-color: var(--ok); color: #fff; }
.pick.oos .qty, .pick.oos .check span { background: var(--bad); border-color: var(--bad); color: #fff; }
.pick.part .qty { background: var(--warn-bg); color: var(--warn); }
.pick .more { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding: 10px; }
.lineops { padding: 8px 0; } .lineops + .lineops { border-top: 1px solid var(--line); }
.step { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.step button { border: 0; background: var(--surface); width: 42px; min-height: 40px; font-size: 20px; font-weight: 700; }
.step output { min-width: 58px; text-align: center; font-weight: 600; }

/* review rows */
.rv { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; text-align: left; }
.rv .q { font: 700 26px/1 var(--display); text-align: center; }
.rv.flagged { border-left: 5px solid var(--warn); }
.rv .nm { font-weight: 600; overflow-wrap: anywhere; }

/* split */
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vs .big { font: 700 40px/1 var(--display); }
.drow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.drow .dn { font-weight: 600; font-size: 17px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.facts div b { display: block; font: 700 26px/1 var(--display); }
.facts div span { font-size: 13px; color: var(--muted); }

/* uploads */
.drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; font-weight: 600; cursor: pointer; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--orange); outline-offset: 2px; }
.rec { border-top: 1px solid var(--line); padding: 10px 0; }
.rec .fn { font-weight: 600; overflow-wrap: anywhere; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; padding: 8px 2px 9px; min-height: 58px; font-size: 13px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 3px; position: relative; }
.nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--orange); }
.nav .badge { position: absolute; top: 5px; left: calc(50% + 6px); background: var(--warn-bg); color: var(--warn); border: 1px solid currentColor; border-radius: 999px; font-size: 11px; padding: 0 5px; line-height: 16px; }

/* sheet + toast */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 20, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; overflow: auto; border-radius: 14px 14px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { margin-bottom: 12px; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; margin: 0 auto; max-width: 520px; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 8px; font-weight: 500; }
.toast:empty { display: none; }
details > summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
@media (min-width: 700px) { h1 { font-size: 40px; } }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.2s; } }

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="nav" id="nav" aria-label="Trip sections" hidden></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* TeamPick logic: no DOM, no network. Everything here is unit-tested in node. */
const TP = (() => {
  const RUNNERS = { jere: "Jere", jesica: "Jesica" };
  const other = (r) => (r === "jere" ? "jesica" : "jere");

  // id, name, icon, zone, seconds per product, fixed seconds (walk + counter wait), pick order.
  // Times are rough planning estimates, not measurements. Pick order runs shelf-stable first, cold last.
  const DEPTS = [
    ["pharmacy", "Pharmacy and OTC", "💊", "nonfood", 35, 60, 1],
    ["hb", "Health and beauty", "🧴", "nonfood", 35, 60, 2],
    ["baby", "Baby", "🍼", "nonfood", 30, 60, 3],
    ["household", "Household", "🧻", "nonfood", 25, 60, 4],
    ["cleaning", "Cleaning", "🧽", "nonfood", 25, 60, 5],
    ["pet", "Pet", "🐾", "nonfood", 30, 60, 6],
    ["pantry", "Pantry", "🍝", "center", 30, 60, 7],
    ["canned", "Canned goods", "🥫", "center", 25, 45, 8],
    ["snacks", "Snacks", "🥨", "center", 25, 45, 9],
    ["beverages", "Beverages", "🥤", "center", 25, 60, 10],
    ["other", "Other", "📦", "other", 40, 60, 11],
    ["floral", "Floral", "💐", "fresh", 40, 45, 12],
    ["produce", "Produce", "🥬", "fresh", 45, 60, 13],
    ["bakery", "Bakery", "🍞", "fresh", 30, 45, 14],
    ["deli", "Deli", "🧀", "counter", 50, 240, 15],
    ["prepared", "Prepared foods", "🍗", "counter", 30, 45, 16],
    ["meat", "Meat", "🥩", "counter", 40, 60, 17],
    ["seafood", "Seafood", "🐟", "counter", 45, 210, 18],
    ["dairy", "Dairy", "🥛", "cold", 25, 60, 19],
    ["frozen", "Frozen", "🧊", "cold", 25, 60, 20],
  ].map(([id, name, icon, zone, per, fixed, order]) => ({ id, name, icon, zone, per, fixed, order }));
  const DEPT = Object.fromEntries(DEPTS.map((d) => [d.id, d]));
  const ZONE_NAMES = { nonfood: "non-food aisles", center: "center aisles", fresh: "fresh departments", counter: "service counters", cold: "cold cases", other: "other" };

  const KEYWORDS = [
    ["produce", /\b(banana|avocado|tomato|onion|lettuce|spinach|pepper|cilantro|lemon|lime|apple|berr(y|ies)|grape|potato|carrot|celery|garlic|cucumber|squash|kale|orange|melon|mushroom)s?\b/],
    ["meat", /\b(chicken breast|ground beef|steak|pork|bacon|sausage|ribs|brisket|ground turkey|chicken thigh)s?\b/],
    ["seafood", /\b(salmon|shrimp|tilapia|cod|crab|tuna steak|catfish|scallop)s?\b/],
    ["deli", /\b(sliced|deli|provolone|salami|prosciutto|hummus)\b/],
    ["bakery", /\b(bread|tortilla|bun|bagel|muffin|loaf|croissant|donut|cake|roll)s?\b/],
    ["dairy", /\b(milk|egg|butter|cheese|yogurt|cream|creamer)s?\b/],
    ["frozen", /\b(frozen|ice cream|pizza|waffle|popsicle)s?\b/],
    ["beverages", /\b(water|juice|soda|cola|coffee|tea|sparkling|beer|wine|gatorade)\b/],
    ["snacks", /\b(chip|cracker|cookie|pretzel|popcorn|candy|granola bar)s?\b/],
    ["canned", /\b(canned|beans|broth|soup|diced tomatoes|tuna)\b/],
    ["cleaning", /\b(detergent|bleach|dish soap|cleaner|sponge|disinfect\w*)\b/],
    ["household", /\b(paper towel|toilet paper|trash bag|foil|napkin|ziploc|batter(y|ies))s?\b/],
    ["hb", /\b(shampoo|conditioner|toothpaste|deodorant|lotion|razor|body wash|soap)\b/],
    ["pharmacy", /\b(ibuprofen|tylenol|acetaminophen|allergy|vitamin|bandage|cough)s?\b/],
    ["baby", /\b(diaper|wipes|formula|baby)s?\b/],
    ["pet", /\b(dog|cat|pet|litter)\b/],
    ["pantry", /\b(rice|pasta|spaghetti|sauce|flour|sugar|oil|cereal|peanut butter|salsa|spice|honey|oats)\b/],
  ];

  /* ---------- text matching ---------- */
  const normName = (s) =>
    String(s || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/h[\s\-‑.]?e[\s\-‑.]?b\b/g, "heb")
      .replace(/&/g, " and ")
      .replace(/[^a-z0-9%/.]+/g, " ")
      .replace(/(^|\s)[./]+|[./]+(\s|$)/g, " ")
      .trim()
      .replace(/\s+/g, " ");
  const normSize = (s) =>
    String(s || "")
      .toLowerCase()
      .replace(/fluid ounces?|fl\.? ?oz\.?/g, "floz")
      .replace(/ounces?|oz\./g, "oz")
      .replace(/pounds?|lbs?\.?/g, "lb")
      .replace(/gallons?|gal\./g, "gal")
      .replace(/quarts?|qt\./g, "qt")
      .replace(/counts?|ct\./g, "ct")
      .replace(/packs?|pk\./g, "pk")
      .replace(/approx(imately)?\.?|about|avg\.?/g, "")
      .replace(/[^a-z0-9/.]+/g, "");
  const productKey = (name, size) => normName(name) + "|" + normSize(size);

  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m || !n) return m + n;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  const nearTok = (a, b) => a === b || (Math.min(a.length, b.length) >= 4 && lev(a, b) <= (Math.max(a.length, b.length) > 6 ? 2 : 1));

  /* Same row seen twice (OCR wobble), never two different flavours. */
  function sameProduct(a, b) {
    const sa = normSize(a.size), sb = normSize(b.size);
    if (sa && sb && sa !== sb) return false;
    const na = normName(a.name), nb = normName(b.name);
    if (!na || !nb) return false;
    if (na === nb) return true;
    const ta = na.split(" "), tb = nb.split(" ");
    if (a.cut || b.cut) {
      // A row cut off at the frame edge: its words must be a leading run of the full row's words.
      const [short, long] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
      if (short.length < 2) return false;
      return short.every((t, i) => long[i] === t || (i === short.length - 1 && long[i] && long[i].startsWith(t)));
    }
    if (ta.length !== tb.length) return false;
    let diffs = 0;
    for (let i = 0; i < ta.length; i++) {
      if (ta[i] === tb[i]) continue;
      if (!nearTok(ta[i], tb[i]) || /\d/.test(ta[i] + tb[i])) return false;
      diffs++;
    }
    return diffs <= Math.max(1, Math.floor(ta.length / 4));
  }

  /* ---------- cleaning what the model returned ---------- */
  const str = (v, max = 160) => (v == null ? "" : String(v).trim().slice(0, max));
  function guessDept(name) {
    const n = normName(name);
    for (const [id, re] of KEYWORDS) if (re.test(n)) return id;
    return "other";
  }
  function cleanItem(raw, frameBase = 0) {
    if (!raw || typeof raw !== "object") return null;
    const name = str(raw.name);
    if (!name) return null;
    const flags = [];
    let qty = Number(raw.qty);
    const qtyShown = raw.qtyShown !== false;
    if (!Number.isFinite(qty) || qty <= 0 || qty > 999) { qty = 1; flags.push("qty"); }
    else if (!qtyShown) flags.push("qty");

    if (!Number.isFinite(conf)) conf = 0.5;
    conf = Math.max(0, Math.min(1, conf));

    if (cut) flags.push("cut");

      dept, aisle: str(raw.aisle, 40), note: str(raw.note, 240), sub: str(raw.sub, 160),
      price: Number.isFinite(price) && price > 0 ? price : null, conf, cut,
      done: raw.done === true, frame: frameBase + (Number.isFinite(Number(raw.frame)) ? Math.max(0, Number(raw.frame) - 1) : 0), flags,

  const custEq = (a, b) => normName(a) === normName(b);

  /* Collapse repeat sightings of one row across overlapping frames of ONE recording.

  function dedupe(items) {
    const out = [];
    const sorted = [...items].sort((a, b) => a.frame - b.frame);

      for (const k of ["brand", "size", "customer", "aisle", "note", "sub"]) if (!hit[k] && it[k]) hit[k] = it[k];
      if (hit.price == null) hit.price = it.price;
      if (hit.dept === "other" && it.dept !== "other") { hit.dept = it.dept; flags.delete("dept"); }
      hit.conf = Math.max(hit.conf, it.conf);
      if (hit.conf >= 0.7) flags.delete("conf");

      hit.seen++;
      hit.flags = [...flags];

  /* Rows with no visible customer: use the runner's label for the recording if given,
     otherwise carry the last header forward and flag it. Never invent a name. */
  function fillCustomers(items, label) {
    let last = "";
    return items.map((it) => {
      const o = { ...it, flags: [...it.flags] };
      if (o.customer) { last = o.customer; return o; }
      if (label) { o.customer = label; return o; }
      o.customer = last;
      if (!o.flags.includes("cust")) o.flags.push("cust");

  /* ---------- workload ---------- */
  // lines: [{dept, key, qty, open}]  ->  { dept: {secs, products, units} }
  function effort(lines, onlyOpen) {

      d.keys.add(l.key);
      d.units += l.qty;

    const res = {};

      const def = DEPT[id] || DEPT.other;
      const products = d.keys.size;
      const extra = Math.max(0, Math.min(20, Math.round(d.units) - products));
      res[id] = { secs: def.fixed + def.per * products + 4 * extra, products, units: d.units };
    }
    return res;
  }

  /* Choose an owner per department to finish soonest: minimise the slower shopper's time,
     with a penalty for splitting neighbouring departments and for moving work already assigned. */
  function balance(eff, opts = {}) {
    const { pins = {}, current = {}, stick = 0 } = opts;
    const ids = Object.keys(eff).sort((a, b) => (DEPT[a] || DEPT.other).order - (DEPT[b] || DEPT.other).order);
    const free = ids.filter((d) => !pins[d]);
    const base = { jere: 0, jesica: 0 };
    for (const d of ids) if (pins[d]) base[pins[d]] += eff[d].secs;
    const zones = {};

      for (let i = 0; i < n; i++) {

        if (r === "jere") a += eff[free[i]].secs; else b += eff[free[i]].secs;
        if (current[free[i]] && current[free[i]] !== r) moved++;

  function explain(ids, owners, pins = {}) {
    const zones = {};
    ids.forEach((d) => (zones[(DEPT[d] || DEPT.other).zone] ||= []).push(d));
    const out = {};
    for (const d of ids) {
      const z = (DEPT[d] || DEPT.other).zone;
      const mates = zones[z].filter((x) => x !== d);
      if (pins[d]) out[d] = "You set this one";
      else if (mates.length && mates.every((x) => owners[x] === owners[d])) out[d] = "Kept with the other " + ZONE_NAMES[z];
      else out[d] = "Evens out the estimated time";

  }

  /* ---------- scroll detection for screen recordings ---------- */
  const BANDS = 12;
  // rgba pixel data -> per-row luminance signature over the middle of the screen
  function rowSig(data, w, h) {

    for (let y = 0; y < h; y++) {
      for (let b = 0; b < BANDS; b++) {
        let s = 0, c = 0;
        for (let x = Math.floor(x0 + b * bw); x < Math.floor(x0 + (b + 1) * bw); x++) {
          const i = (y * w + x) * 4;
          s += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          c++;

        sig[y * BANDS + b] = c ? s / c : 0;

    }

  }
  // How far did the content move between two frames? Ignores the top and bottom 14% (status and tab bars).
  function motion(a, b, h) {
    const y0 = Math.floor(h * 0.14), y1 = Math.ceil(h * 0.86), span = y1 - y0, maxS = Math.floor(span * 0.7);
    const score = (s) => {
      let sum = 0, n = 0;
      const from = Math.max(y0, y0 - s), to = Math.min(y1, y1 - s);
      for (let y = from; y < to; y++) {
        const ia = (y + s) * BANDS, ib = y * BANDS;
        for (let k = 0; k < BANDS; k++) { sum += Math.abs(a[ia + k] - b[ib + k]); n++; }
      }
      return n ? sum / n : Infinity;
    };
    const zero = score(0);
    if (zero < 1.5) return { kind: "still", shift: 0, frac: 0 };
    let bestS = 0, best = zero;
    for (let s = -maxS; s <= maxS; s++) { const v = score(s); if (v < best) { best = v; bestS = s; } }
    if (bestS !== 0 && best < 5 && best < zero * 0.3) return { kind: "scroll", shift: bestS, frac: Math.abs(bestS) / span };
    if (zero < 10 || (Math.abs(bestS) <= 3 && best < zero)) return { kind: "scroll", shift: bestS, frac: 0.05 }; // barely moved: not worth a frame yet
    return { kind: "change", shift: 0, frac: 1 };
  }

  /* ---------- misc ---------- */
  function deepMerge(base, patch) {
    if (patch === null || typeof patch !== "object" || Array.isArray(patch)) return patch;
    const out = base && typeof base === "object" && !Array.isArray(base) ? { ...base } : {};

  }

  const mins = (secs) => Math.max(1, Math.round(secs / 60));

  return { RUNNERS, other, DEPTS, DEPT, ZONE_NAMES, normName, normSize, productKey, sameProduct, guessDept, cleanItem, dedupe, fillCustomers, custEq, effort, balance, explain, rowSig, motion, deepMerge, fmtQty, mins, BANDS };
})();

<script>
/* Standalone adapter.
   Inside Claude the page is handed a `window.claude` with shared storage and image reading.
   On your own host there is no such thing, so this file provides the same small surface
   backed by this repo's /api routes. If neither exists (a bare static host, or the file opened
   from disk) it steps aside and the app keeps everything on the one phone. */
(() => {
  "use strict";
  if (window.claude && window.claude.use) return;
  const LS = "tp.code";
  const lsGet = () => { try { return localStorage.getItem(LS) || ""; } catch { return ""; } };
  const lsSet = (v) => { try { localStorage.setItem(LS, v); } catch {} };
  let code = lsGet();
  const headers = () => ({ "content-type": "application/json", "x-team-code": code });

      const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
      const scrim = mk("div", "scrim"), sheet = mk("div", "sheet"), input = mk("input", "in"), go = mk("button", "btn primary wide", "Open TeamPick");
      sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true"); sheet.setAttribute("aria-label", "Team passcode");
      input.type = "password"; input.autocomplete = "current-password"; input.setAttribute("aria-label", "Team passcode"); input.placeholder = "Team passcode";
      go.type = "button"; go.style.marginTop = "12px";
      const submit = () => { const v = input.value.trim(); if (!v) { input.focus(); return; } scrim.remove(); resolve(v); };
      go.addEventListener("click", submit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      sheet.append(mk("h2", "", "Team passcode"), mk("p", "muted", problem || "Enter the passcode you two share to open your trips."), mk("div", "", ""), input, go);
      sheet.children[2].style.height = "12px";
      scrim.append(sheet); document.body.append(scrim); input.focus();
    }));
  }

  const boot = (async () => {
    let info = null;
    try { const r = await fetch("/api/data?health=1", { cache: "no-store" }); if (r.ok) info = await r.json(); } catch {}
    if (!info || !info.passcode || (!info.storage && !info.reading)) return null;
    window.TP_STANDALONE = true;
    let problem = "";
    for (;;) {
      if (code) {
        const r = await fetch("/api/data?ping=1", { headers: headers(), cache: "no-store" }).catch(() => null);
        if (r && r.ok) break;
        if (!r || r.status !== 401) return null; // server trouble: fall back to this phone only
        problem = "That passcode didn’t work. Try again.";

      code = await askCode(problem);
      lsSet(code);
    }

  })();

  /* ---------- shared storage: polls for changes, writes go straight through ---------- */
  const cache = new Map(); // path -> { v, data }
  const subs = new Set();
  let loaded = false, polling = false, writeSeq = 0, started = false;
  const META = { fromCache: false, hasPendingWrites: false };
  const notify = () => subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } });
  async function api(method, qs, body) {
    let r;
    try { r = await fetch("/api/data" + qs, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined, cache: "no-store" }); }
    catch { throw { code: "unavailable", message: "network" }; }
    if (!r.ok) throw { code: r.status === 401 ? "not_granted" : [400, 404, 413].includes(r.status) ? "invalid_argument" : "unavailable", message: "HTTP " + r.status };
    return r.json();

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const seq = writeSeq;
      const { docs } = await api("GET", "");
      const want = docs.filter((d) => !cache.has(d.path) || cache.get(d.path).v !== d.v).map((d) => d.path);
      const got = want.length ? (await api("GET", "?paths=" + encodeURIComponent(want.join(",")))).docs : [];
      if (seq !== writeSeq) return; // we wrote while this was in flight: these answers may be older than ours
      let changed = !loaded;
      const seen = new Set(docs.map((d) => d.path));
      for (const p of [...cache.keys()]) if (!seen.has(p)) { cache.delete(p); changed = true; }
      for (const d of got) { cache.set(d.path, { v: d.v, data: d.data }); changed = true; }

      if (changed) notify();

  }

    if (started) return;

    doc(path) {

        id, path,
        set: (data) => write({ op: "set", path, data }),

  const b64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej({ code: "image_rejected" }); r.readAsDataURL(blob); });

    if (blob.type === "image/jpeg" && blob.size < 450_000) return { media_type: "image/jpeg", data: await b64(blob) };
    let bmp;
    try { bmp = await createImageBitmap(blob); } catch { throw { code: "image_rejected", message: "could not open image" }; }

    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const jpg = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
    if (!jpg) throw { code: "image_rejected", message: "could not convert image" };
    return { media_type: "image/jpeg", data: await b64(jpg) };
  }
  const sample = async () => { throw { code: "capability_removed", message: "only sample.json is available here" }; };
  sample.limits = async () => ({ maxPromptBytes: 20000, images: { maxCount: 4, maxInputBytes: 20e6, mediaTypes: ["image/jpeg", "image/png", "image/webp"] } });
  sample.json = async (prompt, opts = {}) => {
    const list = opts.images ? (opts.images instanceof Blob ? [opts.images] : [...opts.images]) : [];
    const images = [];
    for (const b of list) images.push(await prep(b));
    let r;
    try { r = await fetch("/api/read", { method: "POST", headers: headers(), signal: opts.signal, body: JSON.stringify({ prompt, images, tier: opts.modelTier === "quick" ? "quick" : "default" }) }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "upstream_error", message: "network" }; }
    if (r.ok) return (await r.json()).result;
    let msg = "HTTP " + r.status;
    try { msg = (await r.json()).error || msg; } catch {}
    console.warn("TeamPick reading:", msg);
    const code = r.status === 401 ? "not_granted" : r.status === 429 ? "rate_limited" : r.status === 413 || r.status === 400 ? "image_rejected" : r.status === 422 ? (msg === "refused" ? "refused" : "invalid_json") : "upstream_error";
    throw { code, message: msg };
  };

  window.claude = {
    use: async (name) => {
      const info = await boot;
      if (!info) return null;
      if (name === "db") return info.storage ? db : null;
      if (name === "sample") return info.reading ? sample : null;
      if (name === "user") return { can: async () => true };
      return null;
    },
  };
})();

  async function createTrip(data) {

  /* ---------- adding items to a trip ---------- */

  /* ---------- recordings -> frames ---------- */
  const once = (target, ok, bad, ms) => new Promise((res, rej) => {
    const done = (fn, v) => { clearTimeout(t); target.removeEventListener(ok, onOk); bad && target.removeEventListener(bad, onBad); fn(v); };

  /* Pass 1 watches the recording at low resolution and notes the moments where the list has moved

  async function framesFromVideo(file, onProg, signal) {

  /* ---------- frames -> items (Claude reads the stills) ---------- */
  function promptFor(rec, n) {
    return [
      `These ${n} image${n === 1 ? " is a still" : "s are consecutive stills"} from a phone screen recording of a grocery shopping list in the Favor runner app, for orders shopped at H-E-B. ${n > 1 ? `They are in order, numbered 1 to ${n}, and neighbouring stills overlap, so one list row can appear in more than one image.` : ""}`,
      "List every product row you can read. Report each distinct row once even if it shows in several stills. If the same product is listed under two different customers or orders, report it once for each.",
      "For each row give these fields:",
      '- "name": the product name exactly as shown',
      '- "brand": the brand if shown, else null',
      '- "qty": the number of units requested, as shown. If no quantity is visible use 1 and set "qtyShown" to false',
      '- "qtyShown": true or false',
      '- "size": package size or weight as shown, such as "1 gal" or "16 oz", else null',
      '- "customer": the customer name or order label this row belongs to, exactly as shown (a header, tab or label), or null if these stills do not show it',
      `- "dept": one of ${DEPTS.map((d) => d.id).join(", ")} (hb is health and beauty; prepared is refrigerated ready-to-eat food)`,
      '- "aisle": aisle or shelf location text if shown, else null',
      '- "note": the customer\'s instructions for this item if shown, else null',
      '- "sub": the substitution preference if shown, else null',
      '- "price": a number if shown, else null',
      '- "conf": 0 to 1, how sure you are that name, quantity and size are right',
      '- "cut": true if the row is cut off at the edge and never fully visible in these stills, else false',
      '- "frame": the number of the first image where the row appears',
      "Rules: report only what is visible. Never guess a size, brand, quantity or customer. Leave out addresses, phone numbers, payment details, totals and anything that is not a product row.",
      rec.label ? `The runner says this recording is the order for "${rec.label.replace(/["\\]/g, "")}". Use that as the customer unless a row clearly shows a different one.` : "",
      'Reply with only JSON in this shape: {"items":[{"name":"H-E-B Whole Milk","brand":"H-E-B","qty":2,"qtyShown":true,"size":"1 gal","customer":"Sydney","dept":"dairy","aisle":null,"note":null,"sub":null,"price":null,"conf":0.95,"cut":false,"frame":1}]}. If there are no product rows reply {"items":[]}.',
    ].filter(Boolean).join("\n");
  }
  const HALT = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed", "images_unavailable", "rate_limited", "session_expired", "cancelled"];
  const ERR_TEXT = {
    not_granted: "Claude isn’t allowed to read images for this page in this view.", sampling_disabled: "Claude isn’t available for this account.", images_unavailable: "This view can’t send images to Claude.",
    rate_limited: "Claude’s usage limit was reached. Wait a little, then read the remaining parts.", session_expired: "Sign in to Claude again, then read the remaining parts.", cancelled: "Stopped.",
    refused: "Claude declined to read part of this recording.", invalid_json: "Part of the answer couldn’t be used.", image_rejected: "One of the images couldn’t be used. Try a different file.",
    video_unreadable: "This browser couldn’t open the video. Screenshots of the list work too.", no_frames: "No list screens were found in this recording.",
  };

  async function readRec(rec, signal) {

        try {
          const out = await cap.sample.json(promptFor(rec, b.n), { images: rec.frames.slice(b.start, b.start + b.n).map((f) => f.blob), signal, modelTier: ui.tier });

  /* ---------- actions on lines ---------- */

  function editLine(T, l) {

    const name = el("input", { class: "in", value: d.n, autocomplete: "off" });
    const size = el("input", { class: "in", value: d.s, placeholder: "16 oz, 1 gal…", autocomplete: "off" });
    const qty = el("input", { class: "in", type: "number", inputmode: "decimal", min: "0.01", step: "any", value: String(d.q) });
    const dept = el("select", { class: "in" }, DEPTS.map((x) => el("option", { value: x.id, selected: x.id === d.d }, x.name)));
    const note = el("input", { class: "in", value: d.note || "", autocomplete: "off" });

      custSel.replaceChildren(...Object.entries(T.cust || {}).filter(([, c]) => c.r === d.r).map(([cid, c]) => el("option", { value: cid, selected: cid === d.c }, `${tagLetter(c)}  ${custName(c)}`)), el("option", { value: "+" }, "New customer…"));

      el("div", { class: "row" }, el("div", { class: "grow" }, tag(T, l.c, TP.fmtQty(l.q) + " for")), el("span", { class: "muted small" }, `${RUNNERS[l.r]}’s Favor order`)),
